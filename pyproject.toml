[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "healthy-pet"
version = "0.2.9"
description = "A desktop health reminder pet that helps you develop healthy work habits"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    {name = "ItisP"}
]
keywords = ["desktop-pet", "health", "reminder", "eye-care", "productivity"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Desktop Environment",
    "Topic :: Utilities",
]
dependencies = [
    "PySide6>=6.5",
    "pynput>=1.7.6",
    "tendo>=0.3.0",
]

[project.optional-dependencies]
macos = ["pyobjc-framework-Cocoa>=10.0"]
linux = ["python-xlib>=0.33"]
all = [
    "healthy-pet[macos,linux]",
]

[project.urls]
Homepage = "https://github.com/ThisisPeggy/healthy-pet"
Repository = "https://github.com/ThisisPeggy/healthy-pet"
Issues = "https://github.com/ThisisPeggy/healthy-pet/issues"

[project.scripts]
healthy-pet = "healthy_pet.__main__:main"
healthy-pet-start = "healthy_pet.__main__:launch_detached"

[tool.setuptools.packages.find]
include = ["healthy_pet*"]

[tool.setuptools.package-data]
healthy_pet = [
    "py.typed",
    "res/icons/*.png",
    "res/sounds/*.wav",
    "res/role/Kitty/action/*.png",
]
